name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install Python dependencies
        run: |
          uv sync --project apps/api
          uv sync --project apps/worker

      - name: Install web dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Check repository hygiene
        shell: pwsh
        run: .\scripts\repo\check-hygiene.ps1

      - name: Check diff whitespace
        run: git diff --check

      - name: Compile Python sources
        run: uv run --project apps/api python -m compileall .\apps\api\src .\apps\api\tests .\packages .\evals

      - name: Run API and eval tests
        run: uv run --project apps/api pytest .\apps\api\tests .\evals\tests

      - name: Run worker tests
        run: uv run --project apps/worker pytest .\apps\worker\tests

      - name: Run web lint
        run: pnpm --dir apps/web lint

      - name: Run web unit tests
        run: pnpm --dir apps/web test

      - name: Build web
        run: pnpm --dir apps/web build

      - name: Install Playwright browser
        run: pnpm --dir apps/web exec playwright install chromium

      - name: Run web E2E tests
        run: pnpm --dir apps/web test:e2e
